name: Build TheFoster APK
run-name: TheFoster Build ${{ inputs.request_id }} — ${{ inputs.app_name }}

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "Название приложения"
        required: true
        default: "TheFoster App"
        type: string
      app_version:
        description: "Версия (например 1.0 или 1.0.0)"
        required: true
        default: "1.0.0"
        type: string
      package_id:
        description: "Package ID"
        required: true
        default: "com.fosterstudio.app"
        type: string
      source_url:
        description: "Временная ссылка на загруженный сайт"
        required: true
        type: string
      request_id:
        description: "ID запроса TheFoster CONVERTER"
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate inputs
        shell: bash
        env:
          APP_NAME: ${{ inputs.app_name }}
          APP_VERSION: ${{ inputs.app_version }}
          PACKAGE_ID: ${{ inputs.package_id }}
          SOURCE_URL: ${{ inputs.source_url }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          set -euo pipefail
          [[ -n "$APP_NAME" && ${#APP_NAME} -le 40 ]] || { echo "App name must be 1–40 characters"; exit 1; }
          [[ "$APP_VERSION" =~ ^[0-9]+([.][0-9]+){1,2}$ ]] || { echo "Version must look like 1.0 or 1.0.0"; exit 1; }
          [[ "$PACKAGE_ID" =~ ^[a-zA-Z][a-zA-Z0-9_]*(\.[a-zA-Z][a-zA-Z0-9_]*)+$ ]] || { echo "Package ID is invalid"; exit 1; }
          [[ "$REQUEST_ID" =~ ^[a-f0-9]{24}$ ]] || { echo "Request ID is invalid"; exit 1; }
          [[ "$SOURCE_URL" =~ ^https:// ]] || { echo "Source URL must use HTTPS"; exit 1; }

      - name: Download user project
        shell: bash
        env:
          SOURCE_URL: ${{ inputs.source_url }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 60 "$SOURCE_URL" -o /tmp/user-project
          test -s /tmp/user-project
          mkdir -p www
          if file /tmp/user-project | grep -qi 'Zip archive'; then
            python3 - <<'PY'
          import zipfile, os, re
          src='/tmp/user-project'; dest='www'
          with zipfile.ZipFile(src) as z:
              infos=z.infolist()
              if len(infos)>5000: raise SystemExit('ZIP contains too many files')
              total=0
              safe=[]
              for i in infos:
                  n=i.filename.replace('\\','/')
                  if n.startswith('/') or re.match(r'^[A-Za-z]:',n) or '..' in n.split('/'):
                      raise SystemExit('Unsafe path in ZIP')
                  total+=i.file_size
                  if total>200*1024*1024: raise SystemExit('Unpacked ZIP exceeds 200 MB')
                  safe.append((i,n))
              for i,n in safe:
                  if i.is_dir(): continue
                  out=os.path.join(dest,*n.split('/'))
                  os.makedirs(os.path.dirname(out),exist_ok=True)
                  with z.open(i) as r, open(out,'wb') as w:
                      while True:
                          b=r.read(1024*1024)
                          if not b: break
                          w.write(b)
          PY
            # If the ZIP contains a single top-level folder, move its website contents to www/.
            if [ ! -f www/index.html ]; then
              mapfile -t found < <(find www -mindepth 2 -type f -iname index.html -print)
              if [ "${#found[@]}" -eq 1 ]; then
                index_path="${found[0]}"; root="$(dirname "$index_path")"; cp -a "$root"/. www/; fi
            fi
          else
            cp /tmp/user-project www/index.html
          fi
          test -f www/index.html || { echo "Uploaded project must contain index.html at its root or in one top-level folder"; exit 1; }
          rm -f /tmp/user-project

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Create Capacitor Android project
        shell: bash
        env:
          APP_NAME: ${{ inputs.app_name }}
          APP_VERSION: ${{ inputs.app_version }}
          PACKAGE_ID: ${{ inputs.package_id }}
        run: |
          set -euo pipefail
          cat > package.json <<'JSON'
          {"name":"thefoster-cloud-builder","version":"1.0.0","private":true,"description":"TheFoster CONVERTER cloud APK builder"}
          JSON
          npm install --no-audit --no-fund @capacitor/core@6 @capacitor/android@6
          npm install --no-audit --no-fund --save-dev @capacitor/cli@6
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          fs.writeFileSync('capacitor.config.json', JSON.stringify({ appId: process.env.PACKAGE_ID, appName: process.env.APP_NAME, webDir: 'www', bundledWebRuntime: false, android: { allowMixedContent: false } }, null, 2));
          NODE
          npx cap add android
          npx cap sync android
          python3 - <<'PY'
          import os, re
          p = "android/app/build.gradle"
          with open(p, encoding="utf-8") as f: s = f.read()
          version = os.environ["APP_VERSION"]
          parts = [int(x) for x in version.split(".")]
          while len(parts) < 3: parts.append(0)
          code = parts[0] * 1000000 + parts[1] * 1000 + parts[2]
          s = re.sub(r'versionCode\s+\d+', f'versionCode {max(1, code)}', s)
          s = re.sub(r'versionName\s+"[^"]+"', f'versionName "{version}"', s)
          with open(p, "w", encoding="utf-8") as f: f.write(s)
          PY

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TheFoster-${{ inputs.request_id }}-${{ inputs.app_version }}-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 3
