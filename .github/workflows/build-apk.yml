name: Build TheFoster APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "Название приложения"
        required: true
        default: "TheFoster App"
        type: string
      app_version:
        description: "Версия (например 1.0 или 1.0.0)"
        required: true
        default: "1.0.0"
        type: string
      package_id:
        description: "Package ID (например com.fosterstudio.app)"
        required: true
        default: "com.fosterstudio.app"
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate inputs
        shell: bash
        env:
          APP_NAME: ${{ inputs.app_name }}
          APP_VERSION: ${{ inputs.app_version }}
          PACKAGE_ID: ${{ inputs.package_id }}
        run: |
          set -euo pipefail
          if [[ ! "$APP_VERSION" =~ ^[0-9]+([.][0-9]+){1,2}$ ]]; then
            echo "Version must look like 1.0 or 1.0.0"
            exit 1
          fi
          if [[ ! "$PACKAGE_ID" =~ ^[a-zA-Z][a-zA-Z0-9_]*(\.[a-zA-Z][a-zA-Z0-9_]*)+$ ]]; then
            echo "Package ID is invalid."
            exit 1
          fi
          if [[ -z "$APP_NAME" || ${#APP_NAME} -gt 50 ]]; then
            echo "App name must be 1–50 characters."
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Prepare website
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p www
          if [ -f site/index.html ]; then
            cp -a site/. www/
          else
            cat > www/index.html <<'HTML'
          <!doctype html>
          <html lang="ru">
          <head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <title>TheFoster App</title>
          <style>body{margin:0;background:#08090d;color:#fff;font:16px Arial;display:grid;min-height:100vh;place-items:center;text-align:center}.card{padding:32px;border:1px solid #f5c400;border-radius:20px;background:#11131a}h1{color:#f5c400}</style></head>
          <body><main class="card"><h1>TheFoster</h1><p>Облачная сборка APK работает.</p><p>Добавь свой сайт в папку <b>site/</b>, файл <b>index.html</b>.</p></main></body></html>
          HTML
          fi
          if [ ! -f www/index.html ]; then
            echo "site/ must contain index.html at its root." >&2
            exit 1
          fi

      - name: Create Capacitor Android project
        shell: bash
        env:
          APP_NAME: ${{ inputs.app_name }}
          APP_VERSION: ${{ inputs.app_version }}
          PACKAGE_ID: ${{ inputs.package_id }}
        run: |
          set -euo pipefail
          cat > package.json <<'JSON'
          {"name":"thefoster-cloud-builder","version":"1.0.0","private":true,"description":"TheFoster CONVERTER cloud APK builder"}
          JSON
          npm install --no-audit --no-fund @capacitor/core@6 @capacitor/android@6
          npm install --no-audit --no-fund --save-dev @capacitor/cli@6
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const appName = process.env.APP_NAME;
          const appVersion = process.env.APP_VERSION;
          const packageId = process.env.PACKAGE_ID;
          fs.writeFileSync('capacitor.config.json', JSON.stringify({
            appId: packageId,
            appName,
            webDir: 'www',
            bundledWebRuntime: false,
            android: { allowMixedContent: false }
          }, null, 2));
          NODE
          npx cap add android
          npx cap sync android
          python3 - <<'PY'
          import os, re
          p = "android/app/build.gradle"
          with open(p, encoding="utf-8") as f:
              s = f.read()
          version = os.environ["APP_VERSION"]
          code = int(re.sub(r"[^0-9]", "", version)[:8] or "1")
          s = re.sub(r'versionCode\s+\d+', f'versionCode {max(1, code)}', s)
          s = re.sub(r'versionName\s+"[^"]+"', f'versionName "{version}"', s)
          with open(p, "w", encoding="utf-8") as f:
              f.write(s)
          PY
        env:
          APP_NAME: ${{ inputs.app_name }}
          APP_VERSION: ${{ inputs.app_version }}
          PACKAGE_ID: ${{ inputs.package_id }}

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TheFoster-${{ inputs.app_version }}-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 3
